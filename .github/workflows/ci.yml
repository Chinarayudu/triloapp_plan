name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Own, ephemeral database per run — CI previously ran tests against
    # secrets.DATABASE_URL, which (like local dev before today) turned out
    # to be the same shared Neon DB the deployed Render backend and its
    # admin/host apps read from. Every CI run was leaving fixture users/
    # KYC submissions/gifts in that live database. TECH_STACK.md §9 calls
    # for "a dedicated Neon branch as the test database" — this uses a
    # disposable Postgres service container instead, same isolation
    # requirement, no Neon branch/secret to provision or rotate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triloplan_ci
          POSTGRES_PASSWORD: triloplan_ci
          POSTGRES_DB: triloplan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Run migrations against the CI Postgres service
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://triloplan_ci:triloplan_ci@localhost:5432/triloplan_ci

      # Stands in for real AWS S3 so kyc.test.ts/withdrawal.test.ts's real
      # upload/download round trip can actually run here, not just locally
      # (src/lib/s3.ts's AWS_S3_ENDPOINT override). Run as a plain step
      # rather than a `services:` container — GitHub Actions' services
      # schema has no way to pass the `server /data` argument the official
      # minio/minio image's entrypoint requires, so `docker run` directly
      # is the reliable option, not a third-party "runs by default" image
      # whose tags can (and have) disappeared out from under a workflow.
      - name: Start MinIO (S3-compatible, for KYC upload tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioci -e MINIO_ROOT_PASSWORD=minioci123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf -X PUT http://localhost:9000/triloplan-ci-bucket \
            -u minioci:minioci123 --aws-sigv4 "aws:amz:us-east-1:s3"

      - run: npm test
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://triloplan_ci:triloplan_ci@localhost:5432/triloplan_ci
          # JWT_SECRET was missing entirely before — env.ts requires it
          # with no default, so this job could never actually boot the
          # app to run any test. Fixed as part of the MinIO change since
          # both were needed to get this workflow genuinely running.
          JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-00
          AWS_ACCESS_KEY_ID: minioci
          AWS_SECRET_ACCESS_KEY: minioci123
          AWS_REGION: us-east-1
          AWS_S3_BUCKET_NAME: triloplan-ci-bucket
          AWS_S3_ENDPOINT: http://localhost:9000
