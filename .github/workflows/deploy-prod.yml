name: Deploy prod

# main = production (deploy/README.md). Every push to main is tested, then
# built and deployed to the prod EC2 server through SSM; no AWS keys are
# stored in GitHub (OIDC role).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Skipped (not failed) until the AWS setup in deploy/README.md is done and
    # the production environment's variables exist.
    if: vars.PROD_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    # The "production" environment holds the vars below and, where the GitHub
    # plan allows it, the required-reviewer approval step.
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/triloplan-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the prod server
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/triloplan-api:${{ github.sha }}
        run: |
          # The compose file and deploy script travel with the command, so the
          # server always runs the versions from this commit.
          jq -n \
            --arg compose "$(base64 -w0 deploy/docker-compose.prod.yml)" \
            --arg script "$(base64 -w0 deploy/deploy.sh)" \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "mkdir -p /opt/triloplan",
              "echo \($compose) | base64 -d > /opt/triloplan/docker-compose.yml",
              "echo \($script) | base64 -d > /opt/triloplan/deploy.sh",
              "bash /opt/triloplan/deploy.sh \($image) \($region)"
            ]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)

          # Not `aws ssm wait`: it gives up after 100s, shorter than a deploy.
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy finished with status: $STATUS"
            exit 1
          fi
